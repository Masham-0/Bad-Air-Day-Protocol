AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  PROTOTYPE Bad-Air Day Protocol backend (Team Shawarma). 5 DynamoDB tables, SNS email topic,
  HTTP API, 4 Lambdas (ingest, agent, alert, api). Build first: bash infra/build.sh

Parameters:
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
    Description: Bedrock model ID or inference profile for the Strands agent
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to every alert (confirm the SNS email after deploy)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    CodeUri: ../.build/backend
    MemorySize: 512
    Architectures: [x86_64]
    Environment:
      Variables:
        SCHOOLS_TABLE: !Ref SchoolsTable
        READINGS_TABLE: !Ref ReadingsTable
        TRACES_TABLE: !Ref TracesTable
        PLANS_TABLE: !Ref PlansTable
        ALERTS_TABLE: !Ref AlertsTable
        ALERT_TOPIC_ARN: !Ref AlertTopic
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  SchoolsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: school_id, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: school_id, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: school_id, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: school_id, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
  TracesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: school_id, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: school_id, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: school_id, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: school_id, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: school_id, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: school_id, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Bad-Air Day Protocol
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [content-type]

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.ingest_handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SchoolsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ReadingsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref TracesTable}
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.agent_handler
      Timeout: 180
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SchoolsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ReadingsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref TracesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref PlansTable}
        - DynamoDBReadPolicy: {TableName: !Ref AlertsTable}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"

  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.alert_handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SchoolsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ReadingsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref TracesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref PlansTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AlertsTable}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt AlertTopic.TopicName}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
      Events:
        Daily0600IST:
          Type: Schedule
          Properties:
            Schedule: cron(30 0 * * ? *)
            Description: 06:00 IST daily protocol email

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.api_handler
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          AGENT_FUNCTION_NAME: !Ref AgentFunction
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SchoolsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ReadingsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref TracesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref PlansTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AlertsTable}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt AlertTopic.TopicName}
        - Statement:
            - Effect: Allow
              Action: [sns:Subscribe, sns:ListSubscriptionsByTopic]
              Resource: !Ref AlertTopic
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
        - LambdaInvokePolicy: {FunctionName: !Ref AgentFunction}
      Events:
        Today:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: "/schools/{id}/today"}
        Protocol:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/schools/{id}/protocol"}
        AlertTest:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/schools/{id}/alert/test"}
        PutSchool:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: PUT, Path: "/schools/{id}"}

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  AlertTopicArn:
    Value: !Ref AlertTopic
